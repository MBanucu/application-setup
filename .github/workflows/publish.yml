name: Build and publish application

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-application
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Optional build cache. Set the repo variable CACHIX_CACHE (and secret
      # CACHIX_AUTH_TOKEN) to enable; otherwise only the public cache.nixos.org
      # binary cache is used, which needs no configuration.
      - name: Cache Nix builds (Cachix)
        if: ${{ vars.CACHIX_CACHE != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build application (headless)
        run: nix-shell --run "SKIP_MAIL=1 python newApplication.py"

      - name: Publish PDFs to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./publishLatest.sh

      - name: Assemble Pages site
        run: |
          appDir=$(ls -1dt applications/*/ | head -1)
          mkdir -p site
          cp "$appDir"Bewerbung/build/German/*.pdf site/Bewerbung.pdf
          cp "$appDir"Bewerbung/build/English/*.pdf site/Application.pdf

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
